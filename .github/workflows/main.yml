name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ScanLite.zip
      - name: Download OCR models
        run: |
          D=ScanLite/app/src/main/assets/tessdata
          curl -L -o $D/ara.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          curl -L -o $D/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: ScanLite
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ScanLite-apk
          path: ScanLite/app/build/outputs/apk/debug/*.apk
